- id: '1790280106233'
  alias: Controllo batterie dispositivi Zigbee
  triggers:
  - trigger: time
    at: '10:00:00'
    weekday:
    - sat
  conditions:
  - condition: template
    value_template: '{{ scariche | count > 0 or offline | count > 0 }}'
  actions:
  - action: script.notifica
    data:
      tipo: tecnico
      titolo: Stato batterie
      messaggio: "{%- set blocchi = [] -%} {%- if scariche | count > 0 -%}\n  {%-
        set blocchi = blocchi + ['Scariche\\n• ' ~ scariche | join('\\n• ')] -%}\n{%-
        endif -%} {%- if offline | count > 0 -%}\n  {%- set blocchi = blocchi + ['Offline\\n•
        ' ~ offline | join('\\n• ')] -%}\n{%- endif -%} {{ blocchi | join('\\n\\n')
        }}"
  mode: single
  variables:
    soglia: 10
    esclusi: '{{ label_entities(''no_controllo_batteria'') }}'
    batterie: "{{ states.sensor\n   | selectattr('entity_id', 'in', integration_entities('mqtt'))\n
      \  | selectattr('attributes.device_class', 'defined')\n   | selectattr('attributes.device_class',
      'eq', 'battery')\n   | map(attribute='entity_id')\n   | reject('in', esclusi)\n
      \  | list }}\n"
    scariche: "{% set ns = namespace(l=[]) %} {% for e in batterie if states(e) |
      is_number and states(e) | float <= soglia %}\n  {% set nome = device_attr(e,
      'name_by_user') or device_attr(e, 'name') %}\n  {% set ns.l = ns.l + [nome ~
      ' (' ~ states(e) ~ '%)'] %}\n{% endfor %} {{ ns.l }}\n"
    offline: "{% set ns = namespace(l=[]) %} {% for e in batterie if states(e) ==
      'unavailable' %}\n  {% set ns.l = ns.l + [device_attr(e, 'name_by_user') or
      device_attr(e, 'name')] %}\n{% endfor %} {{ ns.l }}\n"
- id: '1790329333871'
  alias: Uscita di casa - Notifica luci accese
  description: Quando l'ultimo esce, avvisa di luci interne accese e chiede se spegnere.
  triggers:
  - trigger: state
    entity_id: group.family
    from: home
    to: not_home
  conditions:
  - condition: template
    value_template: '{{ accese | count > 0 or porta_aperta }}'
  actions:
  - variables:
      azione_spegni: LUCI_SPEGNI_{{ context.id }}
      azione_lascia: LUCI_LASCIA_{{ context.id }}
  - repeat:
      for_each: '{{ telefoni }}'
      sequence:
      - action: '{{ repeat.item }}'
        continue_on_error: true
        data:
          title: "\U0001F3E0 Siete usciti"
          message: "{%- set r = [] -%} {%- if accese | count > 0 -%}\n  {%- set r
            = r + ['\U0001F4A1 Luci accese: ' ~ nomi | join(', ')] -%}\n{%- endif
            -%} {%- if porta_aperta -%}\n  {%- set r = r + ['\U0001F6AA La porta del
            corridoio è aperta'] -%}\n{%- endif -%} {{ r | join('\\n') }}"
          data:
            tag: uscita_casa
            actions: "{% if accese | count > 0 %} [{\"action\": \"{{ azione_spegni
              }}\", \"title\": \"Spegni tutto\"},\n {\"action\": \"{{ azione_lascia
              }}\", \"title\": \"Lascia accese\"}]\n{% else %}[]{% endif %}"
  - if:
    - condition: template
      value_template: '{{ accese | count > 0 }}'
    then:
    - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ azione_spegni }}'
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ azione_lascia }}'
      timeout: 00:30:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: "{{ wait.trigger is not none\n   and wait.trigger.event.data.action
          == azione_spegni\n   and is_state('group.family', 'not_home') }}"
      then:
      - action: light.turn_off
        target:
          entity_id: '{{ accese }}'
    - repeat:
        for_each: '{{ telefoni }}'
        sequence:
        - action: '{{ repeat.item }}'
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: uscita_casa
  mode: single
  variables:
    accese: "{{ expand('light.all_ground_floor', 'light.all_basement')\n   | selectattr('state',
      'eq', 'on')\n   | map(attribute='entity_id')\n   | list }}"
    nomi: '{{ accese | map(''state_attr'', ''friendly_name'') | list }}'
    porta_aperta: '{{ is_state(''binary_sensor.ikea_contact_01_contact'', ''on'')
      }}'
    telefoni:
    - notify.mobile_app_iphone_17_di_andrea
    - notify.mobile_app_iphone_di_erica
- id: '1791976257106'
  alias: Gewiss -> Scenario Buonanotte eseguito

- id: ha_startup
  alias: HomeAssistant, notifica servizio avviato
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: script.notifica
    data:
      tipo: tecnico
      messaggio: Home Assistant è stato avviato con successo!
  initial_state: true
- id: ha_update_available
  alias: HomeAssistant, notifica aggiornamento disponibile
  triggers:
  - trigger: state
    entity_id: sensor.docker_hub
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none }}'
  - condition: state
    entity_id: binary_sensor.docker_hub_update_available
    state: 'on'
  actions:
  - action: script.notifica
    data:
      tipo: tecnico
      messaggio: È disponibile la versione {{ trigger.to_state.state }} di Home Assistant!
  initial_state: true
- id: external_lights_turnon
